# Specialties a visit need can target. referral_required controls what happens
# when a patient has never seen the specialty: specialists need clinical review
# first (referral task); primary care gets no task at all.

PCP:
  referral_required: false

Endocrinology:
  referral_required: true

Cardiology:
  referral_required: true

Podiatry:
  referral_required: true

Ophthalmology:
  referral_required: true

Nephrology:
  referral_required: true
